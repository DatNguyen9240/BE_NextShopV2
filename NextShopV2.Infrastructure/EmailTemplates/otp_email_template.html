<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Verification code</title>
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial; background:#f5f7fb; color:#111; }
      .card { max-width:520px; margin:40px auto; background:white; border-radius:8px; padding:24px; box-shadow:0 6px 18px rgba(0,0,0,0.06); }
      .brand { font-weight:700; color:#0f172a; font-size:18px; }
      .lead { color:#374151; margin-top:8px; margin-bottom:18px; }
      .code { display:inline-block; font-size:28px; letter-spacing:6px; font-weight:700; color:#0b5fff; padding:12px 18px; border-radius:8px; background:#f1f6ff; }
      .meta { color:#6b7280; font-size:13px; margin-top:14px; }
      .footer { margin-top:24px; color:#9aa0ad; font-size:12px; }
      a { color:#0b5fff; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand">{{siteName}}</div>
      <div class="lead">Bạn đang cố gắng đăng nhập. Mã xác thực của bạn bên dưới (hết hạn sau <strong>{{expiryMinutes}}</strong> phút):</div>
      <div style="text-align:center; margin:18px 0;"><span class="code">{{code}}</span></div>
      <div class="meta">Nếu bạn không yêu cầu mã này, có thể bỏ qua email này hoặc kiểm tra bảo mật tài khoản của bạn.</div>
      <div class="footer">Nếu cần trợ giúp, liên hệ <a href="mailto:Datnguyen9240@gmail.com">Datnguyen9240@gmail.com</a>.</div>
    </div>
  </body>
</html>
