version: "3.8"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Redis=redis:6379
      - HTTP_PORTS=
      - HTTPS_PORTS=
      - DP_KEYS_PATH=/root/.aspnet/DataProtection-Keys
      - DP_CERT_PATH=/app/secrets/dp_key.pfx # optional, mount if you want certificate protection
      - DP_CERT_PASSWORD="NextShopEmXinhShop123@"
      - DB_MIGRATE_RETRIES=10
      - DB_MIGRATE_DELAY_MS=3000
      - ASPNETCORE_URLS=http://+:8080
    volumes:
      - ./data/dataprotection-keys:/root/.aspnet/DataProtection-Keys
      - ./secrets/dp_key.pfx:/app/secrets/dp_key.pfx:ro # optional
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-ui:
    image: rediscommander/redis-commander:latest
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis


